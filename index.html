<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Each page's title and meta tags are injected here at build time. The
         dev server leaves this placeholder as-is and they are added in the
         browser instead. -->
    <!--app-head-->
    <noscript>
      <!-- Scroll-reveal sections are server-rendered at opacity:0 and only
           become visible once Framer Motion hydrates. Without JS they would
           stay invisible, so reveal everything up front instead. -->
      <style>
        [style*="opacity:0"] { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
